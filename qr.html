<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VPN QR Code</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #eee; font-family: monospace; }
  h1 { font-size: 1.2em; margin-bottom: 20px; }
  #qr { background: white; padding: 16px; border-radius: 8px; }
  .link { font-size: 0.7em; max-width: 600px; word-break: break-all; margin-top: 20px; color: #888; }
  .error { color: #ff6b6b; margin-top: 20px; }
</style>
</head>
<body>
<h1 id="title">VPN-Railway</h1>
<div id="qr"></div>
<div class="link" id="link"></div>
<div class="error" id="error"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  fetch('./connection.json')
    .then(function(r) { return r.json(); })
    .then(function(c) {
      var link = 'vless://' + c.uuid + '@' + c.domain + ':' + c.port
        + '?type=ws&security=tls&path=/' + c.ws_path
        + '&sni=' + c.domain + '&host=' + c.domain + '#' + c.name;
      document.getElementById('title').textContent = c.name;
      document.getElementById('link').textContent = link;
      var qr = qrcode(0, 'M');
      qr.addData(link);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag(6, 0);
    })
    .catch(function(e) {
      document.getElementById('error').textContent = 'Не удалось загрузить connection.json: ' + e.message;
    });
</script>
</body>
</html>
