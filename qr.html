<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VPN QR Code</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #eee; font-family: monospace; }
  h1 { font-size: 1.2em; margin-bottom: 20px; }
  #qr { background: white; padding: 16px; border-radius: 8px; }
  .link { font-size: 0.7em; max-width: 600px; word-break: break-all; margin-top: 20px; color: #888; }
  .error { color: #ff6b6b; margin-top: 20px; }
</style>
</head>
<body>
<h1 id="title">VPN</h1>
<div id="qr"></div>
<div class="link" id="link"></div>
<div class="error" id="error"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var name = (params.get('name') || params.get('instance') || 'vpn1').replace(/[^a-z0-9-]/g, '');
  fetch('instances/' + name + '.json')
    .then(function(r) { return r.json(); })
    .then(function(c) {
      var link = 'vless://' + c.uuid + '@' + c.server + ':' + c.port
        + '?encryption=none&flow=' + c.flow
        + '&security=' + c.security
        + '&sni=' + c.sni
        + '&fp=' + c.fingerprint
        + '&pbk=' + c.public_key
        + '&sid=' + c.short_id
        + '&type=' + c.type + '#' + c.name;
      document.getElementById('title').textContent = 'VPN-' + c.name;
      document.getElementById('link').textContent = link;
      var qr = qrcode(0, 'M');
      qr.addData(link);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag(6, 0);
    })
    .catch(function(e) {
      document.getElementById('error').textContent = 'Не удалось загрузить instances/' + name + '.json: ' + e.message;
    });
</script>
</body>
</html>
